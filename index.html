async function getPoster(title){
  try{
    const res = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${API_KEY}`);
    const data = await res.json();
    return data.Poster && data.Poster !== "N/A" ? data.Poster : "";
  } catch(e){
    return "";
  }
}

async function addMovie(title, url){
  const poster = await getPoster(title);

  const card = document.createElement("div");
  card.className = "card";

  card.onclick = () => window.open(url, "_blank");

  card.innerHTML = `
    <img src="${poster || 'https://via.placeholder.com/300x450?text=No+Image'}">
    <div class="title">${title}</div>
  `;

  grid.appendChild(card);
}

// ✅ AUTO LOAD EVERYTHING FROM ARRAY
items.forEach(([title, url]) => {
  addMovie(title, url);
});
</script>
